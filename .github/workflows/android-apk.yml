
name: Build BP Journey Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/unzip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bp-journey-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Change "." if your Expo app is inside a subfolder,
    # for example: BPJourneyApp
    env:
      APP_DIR: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project files
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "Checking Expo project..."
          test -f package.json || {
            echo "ERROR: package.json not found in APP_DIR=${APP_DIR}"
            exit 1
          }

          node --version
          npm --version
          cat package.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Check Expo configuration
        working-directory: ${{ env.APP_DIR }}
        run: npx expo config --type public

      - name: TypeScript check
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BP-Journey-Android-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bp-journey-apk-${{ github.run_number }}
          name: BP Journey APK #${{ github.run_number }}
          body: |
            BP Journey Android APK.
            Download the APK from the Assets section.
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
